<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SHM ASSETS</title>
    <style>
        /* Base Page Setup */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            /* Beautiful dark modern gradient background */
            background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        /* Main Container */
        .container {
            text-align: center;
            background: rgba(255, 255, 255, 0.05);
            padding: 50px 40px;
            border-radius: 20px;
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.5);
            max-width: 450px;
            width: 100%;
        }

        /* Logo Styling */
        .logo {
            width: 150px;
            height: 150px;
            border-radius: 50%;
            object-fit: cover;
            border: 4px solid transparent;
            /* Glowing gradient border effect */
            background-image: linear-gradient(#0f2027, #0f2027), linear-gradient(45deg, #ff007f, #7f00ff, #00d4ff);
            background-origin: border-box;
            background-clip: content-box, border-box;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
            margin-bottom: 20px;
            transition: transform 0.3s ease;
        }

        .logo:hover {
            transform: scale(1.05);
        }

        /* Header Title */
        .title {
            color: #ffffff;
            font-size: 28px;
            font-weight: 800;
            letter-spacing: 2px;
            margin-bottom: 40px;
            text-transform: uppercase;
            text-shadow: 0 4px 10px rgba(0, 0, 0, 0.4);
        }

        /* Colorful 3D Button */
        .link-btn {
            display: inline-block;
            text-decoration: none;
            color: white;
            font-size: 18px;
            font-weight: bold;
            padding: 18px 45px;
            border-radius: 50px;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            
            /* Colorful Animated Gradient Background */
            background: linear-gradient(45deg, #ff3366, #ff9933, #ff3366);
            background-size: 200% auto;
            animation: shine 3s linear infinite;

            /* 3D Depth Shadow */
            box-shadow: 
                0 8px 0 #cc0033, /* The 3D edge */
                0 15px 25px rgba(0, 0, 0, 0.4); /* The drop shadow */
            
            transition: all 0.15s ease;
            position: relative;
            top: 0;
        }

        /* Button Hover Effect */
        .link-btn:hover {
            box-shadow: 
                0 10px 0 #cc0033, 
                0 20px 30px rgba(0, 0, 0, 0.5);
            top: -2px;
        }

        /* Button Active/Click Effect */
        .link-btn:active {
            /* Pushes the button down to simulate a physical click */
            box-shadow: 
                0 2px 0 #cc0033, 
                0 5px 10px rgba(0, 0, 0, 0.4);
            top: 6px;
        }

        /* Gradient Animation Keyframes */
        @keyframes shine {
            to {
                background-position: 200% center;
            }
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Logo -->
        <img src="sadikul.png" alt="sadikul.png" class="logo" onerror="this.src='https://via.placeholder.com/150/203a43/ffffff?text=SHM'">
        
        <!-- Header -->
        <h1 class="title">SHM Assets</h1>
        
        <!-- HD 3D Colorful Button -->
        <a href="https://github.com/sadikuliam/" target="_selfk" class="link-btn">
            Visit GitHub
        </a>
    </div>

</body>
</html>
